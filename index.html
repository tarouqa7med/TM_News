<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="./css/global.css">
        <link rel="stylesheet" href="./css/animations.css">
        <link rel="stylesheet" href="./css/main.css">
        <link rel="stylesheet" href="./css/main.responsive.css">
        <link rel="icon" href="./images/logo.png">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Saira:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Rubik+Wet+Paint&display=swap" rel="stylesheet">
        <title>TM_News</title>
</head>
<body>

        <div class="loading">
                <div class="big">
                        <div class="small"></div>
                </div>
        </div>

        <div class="nav position-relative z-3">
                <div class="container px-4 d-flex justify-content-between align-items-center">
                        <div class="animated-text">
                                <svg>
                                        <text x="50%" y="50%" dy=".35em" text-anchor="middle">TM_News</text>
                                </svg>
                        </div>
                        <div class="logo d-flex align-items-center column-gap-3">
                                <img class="my-3" src="./images/logo.png" alt="" width="100">
                        </div>
                </div>
        </div>

        <section class="search-and-filter position-relative z-3" id="search-and-filter">
                <div class="container py-5">
                        <form action="">
                                <div class="row text-light">
                                        <div class="col-lg-6">
                                                <div class="item d-block m-auto">
                                                        <div class="form-field">
                                                                <label for="category" class="form-label">Category</label>
                                                                <select class="form-control" name="category" id="category">
                                                                        <option value="business" selected>Business</option>
                                                                        <option value="health">Health</option>
                                                                        <option value="science">Science</option>
                                                                        <option value="sports">Sports</option>
                                                                        <option value="technology">Technology</option>
                                                                </select>
                                                        </div>
                                                </div>
                                        </div>
                                        <div class="col-lg-6">
                                                <div class="item d-block m-auto">
                                                        <div class="form-field">
                                                                <label for="search" class="form-label">Search</label>
                                                                <input type="text" class="form-control" name="search" id="search" placeholder="Search...">
                                                        </div>
                                                </div>
                                        </div>
                                </div>
                                <div class="row text-light">
                                        <div class="col-lg-12">
                                                <div class="item d-flex m-auto column-gap-4">
                                                        <button class="btn w-100 mt-4" type="submit" style="background: #89704f; color: white; font-size: 20px;">
                                                                <span>Filter & Search</span>
                                                        </button>
                                                        <button class="btn w-100 mt-4" type="reset" style="background: #89704f; color: white; font-size: 20px;">
                                                                <span>Reset</span>
                                                        </button>
                                                </div>
                                        </div>
                                </div>
                        </form>
                </div>
        </section>

        <section class="news overflow-hidden">

                <div class="div div1 z-1"></div>
                <div class="div div2 z-1"></div>
                <div class="div div3 z-1"></div>
                <div class="div div4 z-1"></div>
                <div class="div div5 z-1"></div>
                <div class="div div6 z-1"></div>
                <div class="container position-relative z-3">
                        <div class="row pt-3">
                                
                        </div>
                </div>
        </section>

        <nav class="pagination pb-5 d-block m-auto position-relative z-3">
                <ul class="pagination mb-0 d-flex w-auto">

                </ul>
        </nav>

        <script src="./js/jQuery/jQuery.js"></script>
        <script src="./js/variables.js"></script>
        <script src="./js/functions.js"></script>
        <script src="./js/main.js"></script>
</body>
</html>
